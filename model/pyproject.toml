[project]
name = "farm-us"
version = "0.1.0"
description = "FARM-US: Prithvi-EO-2.0 crop-yield regression for the US Corn/Soy Belt (replication + adaptation of the FARM paper)"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Core dependencies. These are enough to run the full synthetic test-suite,
# the dummy-backbone smoke tests, data/manifest/inventory tooling, evaluation
# and tiled inference. The real Prithvi-EO-2.0-600M backbone is an OPTIONAL
# extra ([prithvi]) because it pulls in TerraTorch + large model weights.
dependencies = [
    "torch>=2.4",
    "lightning>=2.3",
    "einops>=0.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.7",
]

[project.optional-dependencies]
# Real Prithvi backbone. Install with:  uv sync --extra prithvi
prithvi = [
    "terratorch>=1.0",
    "timm>=1.0",
    "huggingface-hub>=0.24",
]
# Experiment tracking (optional).
tracking = [
    "tensorboard>=2.16",
    "wandb>=0.17",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
farm-us = "farm_us.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farm_us"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008", "E702", "E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need the real Prithvi backbone / TerraTorch / network (deselect with -m 'not integration')",
    "slow: slow tests",
]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
