# --- 2014-2019 variant (added 2026-10-26) -------------------------------------------------------------
# Identical to spatial_holdout_sd.yaml except: years 2014-2019, imagery_root HLS_Composites2 (where SD 2014-2019 imagery lives;
# 2020-2024 is in HLS_Composites), and its own manifest so the 2020-2024 manifest is untouched.
# SD 2014-2019 labels were built 2026-10-26 (distribute_county_yield_to_pixels.py + merge script, NASS 2014-2024).
# experiment_name is unchanged, so results land in outputs/runs/spatial_holdout_sd/test2014..test2019/ next to
# test2020..test2024. 2019 has only 21 NASS counties (wet year, prevented planting): expect a thin test set.
# --------------------------------------------------------------------------------------------------------
# Zero-shot SPATIAL test of farm-018 (no soil/weather) on SOUTH DAKOTA, soybeans, 2020-2024.
# Same protocol as spatial_holdout_oh.yaml (and spatial_holdout.yaml for MO/NE): norm stats come from the
# checkpoint, never recomputed; expect bias, do not fix it.
# South Dakota is a "far transfer" case: western Corn Belt edge, drier, lower yields (NASS county means ~39-46 bu/ac
# in 2020-2024) than every training state except MD.
# Architecture MUST match farm-018 (temporal_reducer: attention, no exogenous branch) -- copied from spatial_holdout_oh.yaml.
# Inputs checked 2026-10-26: HLS composites 8/8 months x 2020-2024 (all marked complete) in HLS_Composites/<year>/,
# label rasters 2020-2024 under the reader's name, CDL masks 2020-2024. The SD label raster has one more row than the
# CDL/HLS rasters (same corner, zero offset); the reader fills that row with nodata, so it is simply never scored.
experiment_name: spatial_holdout_sd

data:
  crop: SOYBEANS
  # Unseen states only. None of these appear in the checkpoint's training split
  # (IA, IL, IN, MD, MN) -- verified against norm_stats.json `states`.
  states: [SD]
  years: [2014, 2015, 2016, 2017, 2018, 2019]

  label_variant: pseudo
  label_units: bu_ac
  n_timesteps: 8
  chip_size: 224
  stride: 224
  missing_month_policy: temporal_interp

  label_root: ../data_preparation/data/yield_labels/multistate_pseudo
  cdl_root: ../data_preparation/data/cdl_masks
  imagery_root: ../data_preparation/data/HLS_Composites2
  counties_path: ../data_preparation/data/county_maps/selected_states_counties_2023.gpkg

  # Separate from the 5-state manifest so neither can clobber the other, and so
  # the training runs' manifest fingerprint stays untouched.
  manifest_path: outputs/manifests/manifest_sd_2014_2019.parquet

# Ignored in practice -- evaluate_fold resolves norm stats from the checkpoint
# (see note 3). Kept consistent with the checkpoint's resolved_config so nothing
# silently diverges if that resolution path ever changes.
norm:
  mode: fold_training_statistics
  target_scaling: zscore

split:
  policy: explicit_map
  split_map_path: configs/splits/loyo_soybeans.yaml
  test_year: 2024
  val_years: [2023]

model:
  backbone_id: ibm-nasa-geospatial/Prithvi-EO-2.0-600M-TL
  pretrained: true
  finetune_mode: decoder_only
  use_time_embed: true
  use_location_embed: true
  embed_dim: 1280
  depth: 32
  out_blocks_one_based: [8, 16, 24, 32]
  aux_block_one_based: 24
  temporal_reducer: attention      # MUST match farm-018; see header
  decoder_channels: 1024
  ppm_bins: [1, 2, 3, 6]
  multiscale_fpn: false
  head_dropout: 0.1
  use_auxiliary: true
  aux_channels: 256
  final_activation: linear

loss:
  main: mse
  huber_delta: 1.0
  aux_weight: 0.2

train:
  seed: 0
  # Inference only. Nothing below trains; batch/worker counts are sized for
  # evaluation on a machine that may be running something else.
  batch_size: 8
  num_workers: 16
  prefetch_factor: 2
  precision: 16-mixed
  accelerator: auto
