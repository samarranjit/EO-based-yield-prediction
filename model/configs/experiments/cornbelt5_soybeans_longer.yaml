norm:
  mode: fold_training_statistics
  target_scaling: zscore
  # 2,000 chips is far past convergence for 6 band means/stds: measured relative
  # error 0.2-0.6% on band means and 3.4% on the target scale, against ~19 h for
  # the full pass. Seeded, train-split only.
  stats_max_chips: 2000
  stats_seed: 0

split:
  policy: explicit_map
  split_map_path: configs/splits/loyo_soybeans.yaml
  test_year: 2024
  val_years: [2023]

model:
  backbone_id: ibm-nasa-geospatial/Prithvi-EO-2.0-600M-TL
  use_time_embed: true
  use_location_embed: true      # ON, per request
  finetune_mode: decoder_only   # 825M -> 194M trainable
  out_blocks_one_based: [8, 16, 24, 32]
  aux_block_one_based: 24
  temporal_reducer: attention
  decoder_channels: 1024        # paper value; kept -- the paper reached R2 0.81
  ppm_bins: [1, 2, 3, 6]
  use_auxiliary: true
  head_dropout: 0.1             # paper value

loss:
  main: mse
  aux_weight: 0.2

train:
  seed: 0
  epochs: 30
  warmup_epochs: 3              # 3 of 30 = 10%; cornbelt4's 5 of 20 (25%) meant
                                # validation was still read during LR ramp-up.
  early_stopping: true
  early_stopping_patience: 10

  # batch 8 keeps the favourable disk read pattern (measured 7.7 chips/s vs 5.9
  # at batch 24 -- this box reads from a 7200 rpm HDD and is IO-bound, not
  # compute-bound), while accum 3 restores the effective batch of 24.
  batch_size: 8
  grad_accum: 3
  # 64 workers was TRIED AND REVERTED -- measure, don't extrapolate.
  #
  # The reasoning for 64 was: chip construction is ~7 s/chip and workers sat at
  # 100% CPU, so 32 workers cap throughput at ~4.6 chips/s and doubling them
  # should roughly double it. Measured result: 4.324 -> 4.448 samples/s, i.e.
  # +3%, and epoch 0 took 6h12m against 6.4h before. Worker CPU was therefore
  # NOT the binding constraint, and the per-chip-cost model that predicted 2.2x
  # is wrong. The real limiter is still unidentified; do not raise this again
  # without a throughput-vs-workers measurement to justify it.
  #
  # 32 also has 40 h / 6 epochs of stable runtime behind it, whereas the 64-worker
  # run was killed with no traceback (see prefetch_factor below).
  num_workers: 32
  # 64 workers x prefetch 4 x 73.5 MiB/batch = 18.4 GiB of queue, against a
  # `ulimit -l` (max locked memory) of 15.7 GiB on this box -- and pin_memory
  # makes that queue page-locked, so it counts against exactly that cap. The run
  # died silently, which is consistent with being killed rather than raising.
  # At 32 workers x 2 the queue is 4.6 GiB, well inside the limit, and still
  # buffers ~128 batches (~4 min at the observed rate) -- far more than needed to
  # absorb the measured 5.9-9.2 s spread in per-chip build time.
  prefetch_factor: 2
  lr: 5.0e-6
  min_lr: 1.0e-8
  weight_decay: 0.3
  # 22 inf gradients and 94 spikes above 10x median were observed unclipped in
  # the cornbelt4 batch-8 run; fp16 has a narrower exponent range than bf16.
  grad_clip: 1.0

  precision: 16-mixed

  ckpt_monitor: val/main_rmse_phys
  ckpt_mode: min
  periodic_ckpt_every_n_epochs: 3
  periodic_ckpt_save_top_k: -1 
