# 5 states (IA, IL, IN, MD, MN), 2020-2024, LOYO test year 2024, decoder_only.
#
# Successor to cornbelt4_soybeans.yaml. Adding Maryland is aimed at the component
# that actually carries the signal: a variance decomposition of the 2023 labels
# (3.0M pixels, 186 counties) showed
#     BETWEEN counties  std 6.911  = 84% of label variance
#     WITHIN  counties  std 2.983  = 16%
# so predicting county means is essentially the whole task, and more counties is
# more of the thing being learned. MD adds 24 counties x 3 train years.
#
# WHAT THE cornbelt4 RUNS ESTABLISHED (all measured, not assumed):
#   - val R2 plateaus at ~0.48-0.50 from epoch 0; train loss keeps falling 3x.
#   - Ruled out as the cause: spatial diversity (31x more locations, no effect),
#     batch size (3x change, no effect), and location embeddings (removing them
#     made it slightly BETTER: R2 0.4978 vs 0.4829).
#   - Also ruled out: a label information ceiling. If the model predicted every
#     county mean exactly, residual RMSE would be 2.98 bu/ac; it achieves 5.29,
#     so ~41% of the achievable signal is still unclaimed.
#   - Leading remaining hypothesis: scale mismatch. A 224x224 chip at 30 m spans
#     6.72 km, but a county is ~50 km across, so each chip sees ~2% of the area
#     whose mean it must predict. Untested.
#
# Location embeddings are ON here (per request). The no-location ablation showed
# they are not load-bearing, so this is not a leakage concern -- but that run also
# carried the new regularisation, so the two were not perfectly isolated. See
# docs/LOCATION_EMBEDDING_RISK.md.
#
# NOTE: reuses the 15-state manifest -- FarmDataModule._setup_real filters it by
# data.states, so NO rebuild is needed for the added state.
#
# NORM STATS MUST BE RECOMPUTED, NOT REUSED. The train split changed (MD chips
# added), so the 4-state norm_stats.json no longer describes this fold. Beware:
# the reuse guard in training/run.py validates train_years only -- it would NOT
# catch a states mismatch and would accept the 4-state file. Do not pass
# norm.reuse_stats_from here.
experiment_name: cornbelt5_soybeans_longer_time

data:
  crop: SOYBEANS
  states: [IA, IL, IN, MD, MN]
  years: [2014,2015,2016,2017,2018,2019, 2020, 2021, 2022, 2023, 2024]

  label_variant: pseudo
  label_units: bu_ac
  n_timesteps: 8
  chip_size: 224
  stride: 224
  missing_month_policy: temporal_interp

  label_root: ../data_preparation/data/yield_labels/multistate_pseudo
  cdl_root: ../data_preparation/data/cdl_masks
  imagery_root: ../data_preparation/data/HLS_Composites
  counties_path: ../data_preparation/data/county_maps/selected_states_counties_2023.gpkg

