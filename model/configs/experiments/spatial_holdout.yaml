# Zero-shot SPATIAL generalization test: apply the 5-state checkpoint to states
# it has never seen, on the already-held-out 2024 test year.
#
# READ BEFORE INTERPRETING ANY RESULT FROM THIS CONFIG
# ----------------------------------------------------
# 1. What this tests. The national runs hold out a YEAR (LOYO) but train on all
#    five states, so nothing so far measures whether the model transfers to new
#    GROUND. Here the model sees OH / NE / ND for the first time, in a year it
#    has also never seen. Spatial and temporal novelty at once -- the strongest
#    single test available without new data.
#
# 2. The three states are a GRADED series, not a pooled sample. Report them
#    separately (metrics_by_state.csv), not as one number:
#      OH  near transfer      -- eastern Corn Belt, rainfed, close to IN (trained)
#      NE  management shift   -- heavy centre-pivot irrigation; irrigated canopies
#                                stay green under stress that would be visible in
#                                rainfed fields, so this probes whether the model
#                                learned reflectance->yield or just "greener=more"
#      ND  phenological shift -- northern range edge, shorter season, later
#                                planting, lower yields; the Apr-Nov window that
#                                suits Iowa is partly empty here
#    The pooled global-pixel metric is dominated by whichever state has the most
#    soybean pixels and is close to meaningless on its own.
#
# 3. NORM STATS MUST COME FROM THE CHECKPOINT, NOT BE RECOMPUTED. evaluate_fold
#    resolves them via find_norm_stats, which walks up from the checkpoint path
#    to cornbelt5_soybeans_longer_time/test2024/norm_stats.json -- the 5-state
#    TRAINING statistics. That is correct and required: recomputing them on OH /
#    NE / ND would normalise the target distribution using the target's own
#    pixels, which is adaptation, not zero-shot transfer. Never pass
#    norm.reuse_stats_from pointing anywhere else, and never let it recompute.
#
# 4. Expect systematic bias, and do not "fix" it. The target scaler baked into
#    the checkpoint is zscore(center=55.50, scale=9.19) bu/ac -- the five
#    training states' pseudo-yield distribution. ND runs systematically below
#    that; irrigated NE may run above. A per-state offset is a genuine finding
#    about distribution shift. Re-fitting the scaler on the held-out state would
#    use its labels and destroy the test.
#
# 5. Labels here are the same ridge-distributed county pseudo-labels used
#    nationally, so this measures transfer of COUNTY-SCALE skill to new ground.
#    It says nothing about intra-field accuracy -- that is what BARC tests.
#
# Architecture is inherited from cornbelt5_soybeans_longer.yaml and MUST match
# the checkpoint (temporal_reducer: attention). Change only in lockstep with it.
experiment_name: spatial_holdout_oh_ne_nd

data:
  crop: SOYBEANS
  # Unseen states only. None of these appear in the checkpoint's training split
  # (IA, IL, IN, MD, MN) -- verified against norm_stats.json `states`.
  states: [OH, NE, ND]
  years: [2014,2015,2016,2017,2018,2019, 2020, 2021, 2022, 2023, 2024]

  label_variant: pseudo
  label_units: bu_ac
  n_timesteps: 8
  chip_size: 224
  stride: 224
  missing_month_policy: temporal_interp

  label_root: ../data_preparation/data/yield_labels/multistate_pseudo
  cdl_root: ../data_preparation/data/cdl_masks
  imagery_root: ../data_preparation/data/HLS_Composites
  counties_path: ../data_preparation/data/county_maps/selected_states_counties_2023.gpkg

  # Separate from the 5-state manifest so neither can clobber the other, and so
  # the training runs' manifest fingerprint stays untouched.
  manifest_path: outputs/manifests/manifest_spatial_holdout.parquet

# Ignored in practice -- evaluate_fold resolves norm stats from the checkpoint
# (see note 3). Kept consistent with the checkpoint's resolved_config so nothing
# silently diverges if that resolution path ever changes.
norm:
  mode: fold_training_statistics
  target_scaling: zscore

split:
  policy: explicit_map
  split_map_path: configs/splits/loyo_soybeans.yaml
  test_year: 2024
  val_years: [2023]

model:
  backbone_id: ibm-nasa-geospatial/Prithvi-EO-2.0-600M-TL
  pretrained: true
  finetune_mode: decoder_only
  use_time_embed: true
  use_location_embed: true
  embed_dim: 1280
  depth: 32
  out_blocks_one_based: [8, 16, 24, 32]
  aux_block_one_based: 24
  temporal_reducer: attention      # MUST match farm-018; see header
  decoder_channels: 1024
  ppm_bins: [1, 2, 3, 6]
  multiscale_fpn: false
  head_dropout: 0.1
  use_auxiliary: true
  aux_channels: 256
  final_activation: linear

loss:
  main: mse
  huber_delta: 1.0
  aux_weight: 0.2

train:
  seed: 0
  # Inference only. Nothing below trains; batch/worker counts are sized for
  # evaluation on a machine that may be running something else.
  batch_size: 8
  num_workers: 16
  prefetch_factor: 2
  precision: 16-mixed
  accelerator: auto
