# Spatial weather update: inputs are [B,3,8,224,224], nearest-neighbor PRISM
# values at each HLS pixel; pointwise 1x1 convolutions produce spatial FiLM maps.
# Start from farm-018; legacy chip-mean weather checkpoints/stats are incompatible.
# No manifest rebuild or weather redownload needed. Weather tensors now occupy
# ~4.6 MiB/chip (float32); account for this in batch/worker/prefetch memory.
# Stage 1 of soil+weather integration: train ONLY the ExogenousRefiner branch on
# top of the frozen farm-018 checkpoint, at county scale (5 states, 2014-2024,
# same fold as cornbelt5_soybeans_longer.yaml). Mirrors the barc_refiner_hilr.yaml
# recipe exactly, but for models/exogenous_refiner.py, which SUPERSEDES
# detail_refiner.py -- it contains the same raw-imagery residual path and adds
# soil and weather to it. The two branches are mutually exclusive; this config
# therefore leaves detail_refiner at its default (false).
#
#   uv run python -m farm_us.cli train --config configs/experiments/cornbelt5_soil_weather.yaml --real \
#     init_from=outputs/runs/cornbelt5_soybeans_longer_time/test2024/checkpoints/farm-018-0.0000.ckpt
#
# IMAGE-ONLY ABLATION (the control for this run). Emptying both variable lists
# makes ExogenousRefiner structurally identical to DetailRefiner, so this
# isolates what soil and weather add from what a sub-token residual adds at all
# -- run it on the same fold and difference the two:
#
#   uv run python -m farm_us.cli train --config configs/experiments/cornbelt5_soil_weather.yaml --real \
#     init_from=<farm-018.ckpt> data.soil_vars=[] data.weather_vars=[] \
#     experiment_name=cornbelt5_imageonly_ablation
#
# That control matters here: county pseudo-labels have no soil term in them at
# all (their within-county structure is one fixed 4-VI linear projection), so a
# county-scale gain could come entirely from the extra sub-token capacity rather
# than from the covariates.
#
# What this does and does not test
# ---------------------------------
# This is the FIRST arm of the comparison plan discussed for this feature: does
# soil+weather conditioning improve county-scale prediction over farm-018 alone,
# with the 775M base held IDENTICAL (frozen, BatchNorm/dropout in eval, same
# guarantee refiner_only already provides for DetailRefiner)? It does NOT yet
# test spatial generalisation -- county-scale LOYO alone cannot distinguish real
# soil/weather signal from location memorisation (POLARIS is a static 30 m
# raster, a far richer location fingerprint than lat/lon; see
# docs/LOCATION_EMBEDDING_RISK.md). Before trusting a positive result here, run
# the SAME config against configs/experiments/spatial_holdout.yaml states and
# report the LOYO-vs-spatial-holdout gap -- that gap is the memorisation
# measurement, not this run alone.
#
# What differs from cornbelt5_soybeans_longer.yaml, and why:
#   exogenous_refiner + exo_refiner_only   the 775M base stays exactly farm-018
#       (frozen, BatchNorm/dropout held in eval); only the small soil+weather+HLS
#       branch trains. Zero-initialised, so at step 0 predictions equal
#       farm-018's exactly (see models/exogenous_refiner.py's zero-init contract).
#   norm.inherit_init_stats   a frozen base must see the normalisation it was
#       trained with; band_mean/std and the target scaler are inherited unchanged.
#       farm-018's norm_stats.json has no soil/weather statistics (it predates
#       them), so train_fold computes ONLY those, from this fold's train split,
#       via a pass that reads label + CDL + soil + weather and never HLS
#       (training/run.py:ensure_exogenous_stats). When this run's checkpoint is
#       later used as init_from (e.g. BARC), its soil/weather statistics are
#       PRESERVED as long as the variable lists match -- never recomputed.
#   norm.stats_max_chips 2000   caps that pass exactly as in
#       cornbelt5_soybeans_longer.yaml; without it every train chip is read.
#
# Before launching: every soil/weather file must exist for all 11 years' Apr-Nov
# months, or FarmDataModule refuses to start
# (data/exogenous_readers.py:check_exogenous_files). Verified complete on
# 2026-09-28: ppt/tmean/vpdmean each have 88 files = 8 months x 11 years (the
# Dec-Mar months are absent and never read).
#   lr 1e-2, weight_decay 0.0   same reasoning as barc_refiner_hilr.yaml: the
#       branch is fresh and small, and weight decay pulls a zero-initialised
#       output layer back toward zero as fast as it learns.
#
# Architecture MUST otherwise match farm-018 (temporal_reducer: attention,
# decoder_only's frozen-encoder shape) or load_init_weights raises.
experiment_name: cornbelt5_soil_weather

