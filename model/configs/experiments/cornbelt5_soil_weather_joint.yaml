  # --- exogenous covariates ---
  # Soil: only 4 of the 13 POLARIS properties are merged on disk as of this
  # writing (data_preparation/data/soil/polaris/weightedaverage_merged/) --
  # widen this list once more properties are summarised (scripts 07/08) and
  # merged. Weather: vpdmin/vpdmax are excluded -- they are archived to
  # data/prism/extras/ once vpdmean is derived from them, and feeding both the
  # derived value and its raw inputs would be redundant.
  soil_root: ../data_preparation/data/soil/polaris/weightedaverage_merged
  soil_vars: [clay, bd, ksat, om]
  weather_root: ../data_preparation/data/prism/monthly
  weather_vars: [ppt, tmean, vpdmean]

norm:
  mode: fold_training_statistics
  target_scaling: zscore
  inherit_init_stats: true
  stats_max_chips: 2000
  stats_seed: 0

split:
  policy: explicit_map
  split_map_path: configs/splits/loyo_soybeans.yaml
  test_year: 2024
  val_years: [2023]

model:
  backbone_id: ibm-nasa-geospatial/Prithvi-EO-2.0-600M-TL
  use_time_embed: true
  use_location_embed: true
  finetune_mode: decoder_only        # encoder frozen; decoder, heads and exo_refiner train
  out_blocks_one_based: [8, 16, 24, 32]
  aux_block_one_based: 24
  temporal_reducer: attention        # MUST match farm-018 exactly
  decoder_channels: 1024
  ppm_bins: [1, 2, 3, 6]
  use_auxiliary: true
  head_dropout: 0.1
  exogenous_refiner: true
  exo_refiner_hidden: 16

loss:
  main: mse
  aux_weight: 0.2

train:
  seed: 0
  batch_size: 8
  grad_accum: 3
  epochs: 15
  lr: 5.0e-6
  min_lr: 1.0e-8
  warmup_epochs: 2
  weight_decay: 0.01
  scheduler: cosine
  grad_clip: 1.0
  precision: 16-mixed
  early_stopping: true
  early_stopping_patience: 5
  ckpt_monitor: val/main_rmse_phys
  ckpt_mode: min
  periodic_ckpt_every_n_epochs: 2
  periodic_ckpt_save_top_k: -1       # keep all: farm-periodic-001, 003, ... (~3.1 GB each)
  num_workers: 32
  prefetch_factor: 2
  accelerator: auto
