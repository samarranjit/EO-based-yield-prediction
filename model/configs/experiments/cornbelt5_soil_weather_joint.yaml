# Stage 2 of soil+weather integration: JOINT fine-tune. Continues from the Stage 1
# model (v3, cornbelt5_soil_weather.yaml) and trains the decoder, temporal reducers,
# heads and ExogenousRefiner together. The Prithvi encoder stays frozen.
#
#   mkdir -p outputs/logs/Cornbelt5_spatial_soil_weather/v4_main_and_soil_branch_update
#   nohup uv run python -m farm_us.cli train \
#     --config configs/experiments/cornbelt5_soil_weather_joint.yaml --real \
#     init_from=outputs/runs/Cornbelt5_spatial_soil_weather/v3/test2024/checkpoints/farm-009-0.0000.ckpt \
#     > outputs/logs/Cornbelt5_spatial_soil_weather/v4_main_and_soil_branch_update/train.log 2>&1 &
#
# If the job dies, pass resume_from=<run>/checkpoints/last.ckpt instead of init_from.
#
# Why this run: with the decoder frozen, the branch could only add a correction on
# top of farm-018, and part of what it learned is a level shift (2024 bias -0.43 ->
# -1.39, 2025 -2.75). Joint training lets the coarse path take the level back.
#
# What differs from cornbelt5_soil_weather.yaml, and why:
#   experiment_name   version folder under Cornbelt5_spatial_soil_weather/.
#   finetune_mode decoder_only   encoder frozen, everything else trains.
#   init_from v3, not farm-018   the branch is already trained, which is what makes
#       one shared LR workable. From farm-018 the fresh branch would need ~1e-3.
#   lr 5e-6   the peak LR farm-018's decoder was trained at. 1e-3 would destroy the
#       decoder. The branch moves at 1/200th of its Stage 1 LR: small adjustments only.
#   min_lr 1e-8, grad_accum 3   same as farm-018 (grad_accum 1 means 3x the updates).
#   weight_decay 0.01   shrinks weights only ~0.2% over the run at this LR.
#   epochs 15, warmup_epochs 2   LR 2.5e-6, 5e-6, then cosine over the rest.
#   early_stopping_patience 5   15 could not fire usefully in a 15-epoch run; must
#       exceed warmup_epochs because the count starts at epoch 0.
#   periodic_ckpt every 2 epochs, all kept   any of them can be evaluated later.
#
# Train and val curves: uv run python scripts/plot_training_curves.py --run-dir <run>/test2024
#
# norm.inherit_init_stats is not enforced in decoder_only, so it must stay true here:
# recomputing would change the scaling the decoder and branch were trained with.
#
# Judging it: select on val 2023 only (v3 best val RMSE 4.469; epoch 0 should stay
# close). Then 2024 including county vs NASS, then the OH and SD spatial holdouts: the
# decoder can now adapt to static soil, a location fingerprint, and LOYO cannot see
# that. This run does not show whether soil/weather add anything over image-only.
experiment_name: Cornbelt5_spatial_soil_weather/v4_main_and_soil_branch_update

