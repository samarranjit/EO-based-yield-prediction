# Explicit validation-year mapping for each LOYO test year (2014-2024).
# Rule: validation = the year immediately BEFORE the test year (forecasting-style),
# falling back to the immediately-following year for the earliest test year.
# Train = all remaining years. Edit freely; the leakage audit enforces disjointness.
val_years_by_test_year:
  2014: [2015]
  2015: [2014]
  2016: [2015]
  2017: [2016]
  2018: [2017]
  2019: [2018]
  2020: [2019]
  2021: [2020]
  2022: [2021]
  2023: [2022]
  2024: [2023]
