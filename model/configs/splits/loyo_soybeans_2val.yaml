# Explicit validation-year mapping for each LOYO test year (2014-2024), TWO years.
# Rule: validation = the year immediately BEFORE and the year immediately AFTER the
# test year, so no single atypical year controls checkpoint selection and early
# stopping. At the ends of the range, where one neighbour does not exist, the two
# nearest available years are used instead (2014 -> 2015, 2016; 2024 -> 2022, 2023).
# Train = all remaining years (8 per fold). The leakage audit enforces disjointness.
val_years_by_test_year:
  2014: [2015, 2016]
  2015: [2014, 2016]
  2016: [2015, 2017]
  2017: [2016, 2018]
  2018: [2017, 2019]
  2019: [2018, 2020]
  2020: [2019, 2021]
  2021: [2020, 2022]
  2022: [2021, 2023]
  2023: [2022, 2024]
  2024: [2022, 2023]
